# Rules follow the code as it is written in this repository.
included:
  - Package.swift
  - Sources
  - Tests
  - Tools
disabled_rules:
  # frame(of:) checks the CF type before each as!, so the cast cannot fail.
  - force_cast
  # The scripts in Tools stop at the first error, which is what try! does.
  - force_try
  - trailing_comma
  - void_function_in_ternary
line_length: 140
identifier_name:
  excluded: [i, p]
